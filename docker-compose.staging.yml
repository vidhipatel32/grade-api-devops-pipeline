services:
  grade-api:
    image: grade-api:${BUILD_NUMBER:-latest}
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - grade-network

networks:
  grade-network:
    driver: bridge
